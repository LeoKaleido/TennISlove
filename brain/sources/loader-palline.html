<title>Loader palline</title>
<style>
  :root { --bg: #ece3d2; --ink: #3a2427; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #page-loader { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: var(--bg);
                 transition: opacity .5s ease, visibility .5s ease; }
  #page-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .loader-label { position: absolute; left: 0; right: 0; top: 40px; text-align: center;
                  font-size: 14px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; }
  .loader-label::after { content: ""; display: inline-block; width: 1.7em; text-align: left;
                         animation: dots 1.5s steps(1) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  #spinner { transform-box: fill-box; transform-origin: center; animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #spinner { animation: none; }
    .loader-label::after { animation: none; content: "..."; }
  }
  main { padding: 48px; }
</style>
</head>

<script>
(function () {
  'use strict';
  var AUTO_HIDE = false;          // true: il loader sparisce a pagina caricata
  var MIN_VISIBLE_MS = 3000;

  var NS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  var svg = $('stage');
  var CX = 622.5, CY = 620, RING_OUT = 595, BALL_R = 42;
  var SIZE = 0.5, BS = 1 / SIZE;    /* SIZE: grandezza del cerchio rispetto a prima; BS: le palline restano della dimensione di prima */

  var T = 1.2;                      /* una pallina ogni 1,2 s */
  var TIN = 0.95;                   /* volo d'arrivo */
  var TOUT = 1.1;                   /* rimbalzo fino all'uscita */
  var TC = 1.0;                     /* istante del primo impatto */
  /* a: angolo (gradi, 0 = destra, 90 = basso) del punto d'impatto sul cerchio; b: scarto d'arrivo; g: ricaduta */
  var HITS = [
    { a: 192, b: -12 }, { a: -18, b: 10 }, { a: 160, b: 14 }, { a: 22, b: -12 },
    { a: 218, b: 8 },   { a: -42, b: -8 }, { a: 178, b: 4 },  { a: 6, b: 16 }
  ];
  var N = HITS.length, halfW = 900, halfH = 600;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function mod(a, n) { return ((a % n) + n) % n; }
  function rad(d) { return d * Math.PI / 180; }
  function f(n) { return Math.round(n * 10) / 10; }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = SIZE * Math.min(vh * 0.6 / 1230, vw * 0.84 / 1230);
    var w = vw / s, h = vh / s, cyPx = vh / 2 - 22;
    svg.setAttribute('viewBox', f(CX - w / 2) + ' ' + f(CY - cyPx / s) + ' ' + f(w) + ' ' + f(h));
    $('label').style.top = Math.min(vh - 40, cyPx + 612 * s + 28) + 'px';
    halfW = w / 2; halfH = h / 2;
    HITS.forEach(function (hit) {
      var a = rad(hit.a), n = { x: Math.cos(a), y: Math.sin(a) };
      hit.n = n;
      hit.Pc = { x: CX + n.x * (RING_OUT + (BALL_R - 6) * BS), y: CY + n.y * (RING_OUT + (BALL_R - 6) * BS) };
      var bb = rad(hit.a + hit.b), v = { x: Math.cos(bb), y: Math.sin(bb) };      /* da dove arriva */
      var lim = Math.max(halfW, halfH) + 160;
      var L = 1500;
      for (var i = 0; i < 80; i++) { if (Math.abs(hit.Pc.x + v.x * L - CX) > halfW + 120 || Math.abs(hit.Pc.y + v.y * L - CY) > halfH + 120) break; L += 120; }
      hit.P0 = { x: hit.Pc.x + v.x * L, y: hit.Pc.y + v.y * L };
      hit.v = v; hit.L = L;
      var sp = L / TIN * 1.15;                                      /* velocità d'impatto circa */
      var vin = { x: -v.x * sp, y: -v.y * sp }, dn = vin.x * n.x + vin.y * n.y;
      hit.vout = { x: (vin.x - 2 * dn * n.x) * 0.5, y: (vin.y - 2 * dn * n.y) * 0.5 - 120 };
    });
  }

  /* ===== Elementi ===== */
  var el = {}; ['body', 'person', 'portrait', 'dm', 'fx', 'balls'].forEach(function (id) { el[id] = $(id); });
  function mk(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e); return e;
  }
  var NB = 3, ballEls = [];
  for (var i = 0; i < NB; i++) {
    var g = mk('g', { visibility: 'hidden' }, el.balls);
    var trail = mk('path', { fill: 'url(#trailG)' }, g);
    var sq = mk('g', {}, g);
    var spin = mk('g', {}, sq);
    mk('circle', { r: BALL_R, fill: '#d9ec3a' }, spin);
    mk('path', { d: 'M-34 -24 C-12 -8 -12 12 -34 26', fill: 'none', stroke: '#f9f3e5', 'stroke-width': 5, 'stroke-linecap': 'round' }, spin);
    mk('path', { d: 'M34 -24 C12 -8 12 12 34 26', fill: 'none', stroke: '#f9f3e5', 'stroke-width': 5, 'stroke-linecap': 'round' }, spin);
    mk('path', { d: 'M-30 26 A42 42 0 0 0 30 28 A44 44 0 0 1 -30 26 Z', fill: '#9bae1b', opacity: '.55' }, spin);
    mk('circle', { r: BALL_R - 1.5, fill: 'none', stroke: '#8da01a', 'stroke-width': 3, opacity: '.7' }, spin);
    ballEls.push({ g: g, trail: trail, sq: sq, spin: spin });
  }
  var fxPool = [];
  for (i = 0; i < 3; i++) {
    var fg = mk('g', { visibility: 'hidden' }, el.fx);
    var wave = mk('circle', { r: 10, stroke: '#3a2427', 'stroke-width': 8 }, fg);
    var rays = [];
    for (var r = 0; r < 7; r++) rays.push(mk('path', { stroke: '#3a2427', 'stroke-width': 7 }, fg));
    fxPool.push({ g: fg, wave: wave, rays: rays });
  }

  /* ===== Ball ===== */
  function ballPos(k, t) {
    var hit = HITS[mod(k, N)], tc = k * T + TC, dt = t - tc;
    if (dt <= 0) {
      var u = clamp((t - (tc - TIN)) / TIN, 0, 1), e = 0.65 * u + 0.35 * u * u;
      var arc = Math.sin(Math.PI * u) * 0.07 * hit.L;
      var px = lerp(hit.P0.x, hit.Pc.x, e), py = lerp(hit.P0.y, hit.Pc.y, e) - arc * (1 - u);
      return { x: px, y: py };
    }
    var tau = Math.min(dt, TOUT);
    return { x: hit.Pc.x + hit.vout.x * tau, y: hit.Pc.y + hit.vout.y * tau + 0.5 * 2300 * BS * tau * tau };
  }
  function drawBall(k, t, slot) {
    var b = ballEls[slot], tc = k * T + TC, hit = HITS[mod(k, N)];
    if (t < tc - TIN || t > tc + TOUT) return;
    var e = 0.008, a = ballPos(k, t), a0 = ballPos(k, t - e), a1 = ballPos(k, t + e);
    var vx = (a1.x - a0.x) / (2 * e), vy = (a1.y - a0.y) / (2 * e), sp = Math.hypot(vx, vy) || 1;
    var ang = Math.atan2(vy, vx) * 180 / Math.PI, dt = t - tc;
    var st = clamp(sp / 5200, 0, .45), sx = 1 + st, sy = 1 / (1 + st * .6);
    var press = 0;                                                  /* schiacciata contro il cerchio */
    if (Math.abs(dt) < 0.05) press = 1 - Math.abs(dt) / 0.05;
    var nang = Math.atan2(hit.n.y, hit.n.x) * 180 / Math.PI;
    b.g.setAttribute('visibility', 'visible');
    b.g.setAttribute('opacity', dt > TOUT - 0.3 ? f(clamp((tc + TOUT - t) / 0.3, 0, 1) * 100) / 100 : 1);
    b.g.setAttribute('transform', 'translate(' + f(a.x) + ' ' + f(a.y) + ') scale(' + BS + ')');
    if (press > 0) {
      b.sq.setAttribute('transform', 'rotate(' + f(nang) + ') scale(' + f(1 - 0.34 * press) + ' ' + f(1 + 0.2 * press) + ') rotate(' + f(-nang) + ')');
    } else {
      b.sq.setAttribute('transform', 'rotate(' + f(ang) + ') scale(' + f(sx) + ' ' + f(sy) + ') rotate(' + f(-ang) + ')');
    }
    b.spin.setAttribute('transform', 'rotate(' + f((t < tc ? t * 420 : t * 900) * (mod(k, 2) ? -1 : 1)) + ')');
    var len = clamp(sp * 0.05, 0, 200) * (press > 0 ? 0 : 1), w = BALL_R * .85;
    b.trail.setAttribute('transform', 'rotate(' + f(ang) + ')');
    b.trail.setAttribute('d', len < 8 ? '' : 'M-8 ' + f(-w) + ' L' + f(-(len + 10)) + ' 0 L-8 ' + f(w) + ' Z');
  }

  /* ===== Urto: vibrazione smorzata del cerchio ===== */
  function shake(t) {
    var ox = 0, oy = 0, rot = 0, m = [1, 0, 0, 1], ix = 0, iy = 0, irot = 0, face = 0, fdir = 1;
    var kc = Math.floor((t - TC) / T);
    for (var k = kc - 1; k <= kc; k++) {
      var hit = HITS[mod(k, N)], dt = t - (k * T + TC);
      if (dt < 0 || dt > 1.4) continue;
      var env = Math.exp(-4.2 * dt), osc = Math.sin(2 * Math.PI * 6.8 * dt);
      var amp = 30 * env * osc;                                     /* spinta lungo la normale (verso l'interno) */
      ox -= hit.n.x * amp; oy -= hit.n.y * amp;
      rot += -hit.n.y * 2.6 * env * Math.sin(2 * Math.PI * 5.4 * dt) + hit.n.x * 0.5 * env * osc;
      /* il contenuto "balla" un po' in ritardo, come un liquido dentro il cerchio */
      var d2 = Math.max(0, dt - 0.045), env2 = Math.exp(-3.4 * d2), osc2 = Math.sin(2 * Math.PI * 6.8 * d2 - 0.4);
      ix += hit.n.x * 16 * env2 * osc2; iy += hit.n.y * 16 * env2 * osc2;
      irot += hit.n.x * 2.2 * env2 * Math.sin(2 * Math.PI * 5.2 * d2) - hit.n.y * 0.8 * env2 * osc2;
      /* schiacciamento iniziale lungo la direzione del colpo */
      var q = Math.exp(-9 * dt) * Math.cos(2 * Math.PI * 9 * dt), mm = -0.075 * q, pp = 0.045 * q;
      var nx = hit.n.x, ny = hit.n.y;
      var a = 1 + mm * nx * nx + pp * ny * ny, b = (mm - pp) * nx * ny, d = 1 + mm * ny * ny + pp * nx * nx;
      m = [m[0] * a + m[2] * b, m[1] * a + m[3] * b, m[0] * b + m[2] * d, m[1] * b + m[3] * d];
      /* espressione */
      var ee = dt < 0.05 ? dt / 0.05 : dt < 0.5 ? 1 : dt < 0.95 ? 1 - (dt - 0.5) / 0.45 : 0;
      ee = ee * ee * (3 - 2 * ee);
      if (ee > face) { face = ee; fdir = hit.n.x >= 0 ? 1 : -1; }
    }
    el.body.setAttribute('transform', 'translate(' + f(ox) + ' ' + f(oy) + ') translate(' + CX + ' ' + CY + ') rotate(' + f(rot) + ') matrix(' + m.map(function (v) { return Math.round(v * 1000) / 1000; }).join(' ') + ' 0 0) translate(' + (-CX) + ' ' + (-CY) + ')');
    el.person.setAttribute('transform', 'translate(' + f(ix) + ' ' + f(iy) + ') rotate(' + f(irot + face * fdir * -1.8) + ' 622 1050)');
    if (face > 0.004) { el.dm.setAttribute('scale', f(112 * face)); el.portrait.setAttribute('filter', 'url(#morph)'); }
    else el.portrait.removeAttribute('filter');
  }

  /* ===== Onda d'urto ===== */
  function impacts(t) {
    var kc = Math.floor((t - TC) / T);
    for (var j = 0; j < fxPool.length; j++) {
      var k = kc - j, hit = HITS[mod(k, N)], dt = t - (k * T + TC), p = fxPool[j];
      if (dt < 0 || dt > 0.5) { p.g.setAttribute('visibility', 'hidden'); continue; }
      var u = dt / 0.5, op = f((1 - u) * (1 - u) * 100) / 100;
      var px = CX + hit.n.x * (RING_OUT + 4), py = CY + hit.n.y * (RING_OUT + 4);
