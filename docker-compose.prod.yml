# Produzione sul VPS, un unico container (D-054): docker compose -f docker-compose.prod.yml up -d --build
# Procedura completa: brain/05-runbook.md
name: tentennis-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # il database è nello stesso container: vale anche per i comandi lanciati a mano (seed, backup)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
    # solo dal server stesso: il suo web server (con HTTPS) fa da proxy verso http://127.0.0.1:8080
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - uploads:/data/uploads
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  uploads:
