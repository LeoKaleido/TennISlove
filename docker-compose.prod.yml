# Produzione sul VPS, un unico container (D-054): docker compose -f docker-compose.prod.yml up -d --build
# Procedura completa: brain/05-runbook.md
name: tentennis-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # il database è nello stesso container: vale anche per i comandi lanciati a mano (seed, backup)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
    # solo Nginx è raggiungibile da fuori; database e API restano dentro il container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - uploads:/data/uploads
      - letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  uploads:
  letsencrypt:
