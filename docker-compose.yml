# Ambiente di sviluppo: `docker compose up`
# - web:     http://localhost:5173
# - api:     http://localhost:3000 (il web la raggiunge via proxy /api)
# - mailpit: http://localhost:8025 (email di sviluppo, es. magic link)
name: tentennis

x-node: &node
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  volumes:
    - .:/repo
    - node_modules:/repo/node_modules
    - api_node_modules:/repo/apps/api/node_modules
    - web_node_modules:/repo/apps/web/node_modules
    - shared_node_modules:/repo/packages/shared/node_modules
    - pnpm_store:/pnpm/store
  env_file: .env

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"

  install:
    <<: *node
    command: pnpm install --frozen-lockfile=false

  api:
    <<: *node
    working_dir: /repo/apps/api
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      UPLOAD_DIR: /repo/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully

  web:
    <<: *node
    working_dir: /repo/apps/web
    command: pnpm dev --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      install:
        condition: service_completed_successfully

volumes:
  pgdata:
  node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  pnpm_store:
