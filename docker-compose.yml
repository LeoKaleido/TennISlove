# Ambiente di sviluppo: `docker compose up -d`, un unico container con tutto dentro (D-054)
# - web:     http://localhost:5173 (anche dal telefono sulla stessa rete)
# - api:     http://localhost:3000 (il web la raggiunge via proxy /api)
# - mailpit: http://localhost:8025 (email di sviluppo, es. codici di accesso)
# - db:      localhost:5432
name: tentennis

services:
  app:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      UPLOAD_DIR: /repo/uploads
      API_PROXY_TARGET: http://localhost:3000
    ports:
      - "5173:5173"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:5432:5432"
    volumes:
      - .:/repo
      - pgdata:/var/lib/postgresql/data
      - node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - shared_node_modules:/repo/packages/shared/node_modules
      - pnpm_store:/pnpm/store
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      retries: 30

volumes:
  pgdata:
  node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  pnpm_store:
