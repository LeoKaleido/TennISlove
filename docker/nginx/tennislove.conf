# Nginx nel container: file del web e proxy verso l'API, solo HTTP.
# L'HTTPS lo fa il server davanti (D-056), che inoltra qui le richieste da 127.0.0.1:8080.
server_tokens off;

# Limiti per IP: login stretto (protegge le email e i tentativi di accesso), resto dell'API largo
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # IP reale del visitatore dal proxy: il container è raggiungibile solo da lì (porta su 127.0.0.1),
    # così i limiti per IP valgono per persona e non per il proxy
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;


    # Foto fino a 8 MB lato API, con un po' di margine
    client_max_body_size 10m;

    # Valgono per tutte le risposte: nelle location non si usa add_header, altrimenti questi verrebbero persi
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # app privata: niente motori di ricerca
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Nessun Referer verso altri siti
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx è il primo punto di ingresso: si sovrascrive quello che manda il client
    proxy_set_header X-Forwarded-For $remote_addr;
    # https, deciso dal proxy davanti
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # l'API manda già nosniff sulle foto: niente header doppio
    proxy_hide_header X-Content-Type-Options;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    root /usr/share/nginx/html;
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        # index.html, sw.js e manifest sempre freschi, così dopo un rilascio arrivano i nuovi file
        expires -1;
        try_files $uri /index.html;
    }
}
