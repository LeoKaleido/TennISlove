    <style>
      /* Schermata di avvio, condivisa con il componente Splash (src/components/ui.tsx).
         Le schermate native di iPhone (public/splash) sono solo il colore di sfondo: il cuore compare qui con una dissolvenza. */
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0b1a24; }
      .boot img { width: 140px; opacity: 0; transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1); }
      .boot img.in { opacity: 1; }
      .boot-leaving { pointer-events: none; animation: boot-out 0.28s ease forwards; }
      @keyframes boot-out { to { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- schermata di avvio: fuori da #root, React non la ridisegna; boot.ts la fa sfumare quando l'app è pronta.
         Il cuore è un'immagine e non un SVG nella pagina: un'animazione SVG nella pagina parte solo a caricamento finito,
         un'immagine ha un orologio suo e si muove appena è caricata. -->
    <div id="boot" class="boot"><img src="/loader.svg" alt="" /></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
